name: Release

on:
  push:
    tags:
      - "v*.*.*"
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.issue.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Release / Authorization
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       startsWith(github.event.issue.title, 'Release v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      target_sha: ${{ steps.release.outputs.target_sha }}
      request_mode: ${{ steps.release.outputs.request_mode }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Authorize exact release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          expected_tag="v${version}"
          git fetch --no-tags origin main:refs/remotes/origin/main

          if [[ "${EVENT_NAME}" == "issues" ]]; then
            [[ "${ACTOR}" == "${REPOSITORY_OWNER}" ]]
            [[ "${ISSUE_TITLE}" == "Release ${expected_tag}" ]]
            target_sha="$(git rev-parse refs/remotes/origin/main)"
            request_mode="issue"
          else
            [[ "${REF_NAME}" == "${expected_tag}" ]]
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
            target_sha="$(git rev-parse HEAD)"
            request_mode="tag"
          fi

          echo "release_tag=${expected_tag}" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "request_mode=${request_mode}" >> "${GITHUB_OUTPUT}"

  validate-python:
    name: Release / Python
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 0
      - name: Require validated commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node 26.1.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.1.0"
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Validate repository
        run: python scripts/21_validate_repository.py
      - name: Validate configuration
        run: python scripts/22_validate_configs.py
      - name: Validate V7 parity-plus
        run: python scripts/35_validate_v7_parity.py
      - name: Validate V7 full parity superset
        run: python scripts/39_validate_v7_superset.py
      - name: Validate document ingestion and exchange
        run: python scripts/44_validate_document_flow.py
      - name: Validate August 2026 model fleet
        run: python scripts/45_validate_model_fleet.py
      - name: Validate transversal pedagogy
        run: python scripts/46_validate_transversal_pedagogy.py
      - name: Validate pre-V1 hardening
        run: python scripts/47_validate_pre_v1_hardening.py
      - name: Validate documentation portal
        run: python scripts/48_validate_documentation_portal.py
      - name: Validate OpenClaw 2026.9.4 lock
        run: python scripts/49_validate_openclaw_version.py
      - name: Verify locked OpenClaw and Parallel npm artifacts
        run: python scripts/50_verify_npm_integrities.py
      - name: Validate specialist tooling and publication
        run: python scripts/51_validate_specialist_tooling.py
      - name: Validate SemVer request and V1 readiness
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        run: python scripts/24_validate_release.py --tag "${RELEASE_TAG}"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src
      - name: Tests with coverage
        run: pytest -q --cov=clawlocal --cov-report=term-missing --cov-fail-under=75
      - name: Build package
        run: python -m build
      - name: Generate CycloneDX SBOM
        run: python scripts/25_generate_sbom.py --output dist/sbom.cdx.json
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  validate-windows:
    name: Release / PowerShell 7
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
      - name: Install PowerShell quality modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $targets = @('.\menu.ps1', '.\scripts\windows', '.\tests\powershell')
          $findings = foreach ($target in $targets) {
            Invoke-ScriptAnalyzer -Path $target -Recurse -Settings '.\.github\powershell\PSScriptAnalyzerSettings.psd1'
          }
          if ($findings) {
            $findings | Format-Table -AutoSize
            throw "PSScriptAnalyzer a détecté $(@($findings).Count) anomalie(s)."
          }
      - name: Pester
        shell: pwsh
        run: Invoke-Pester -Path '.\tests\powershell' -CI -Output Detailed

  publish:
    name: Publish GitHub release
    needs: [authorize, validate-python, validate-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create validated release tag from owner request
        if: needs.authorize.outputs.request_mode == 'issue'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.authorize.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Le tag ${RELEASE_TAG} existe déjà; refus de le déplacer." >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${RELEASE_SHA}"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes
