name: Parallel SRI Discovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 26.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.0.0"
      - name: Capture exact Parallel npm integrity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("config/v1/runtime_versions.json"))["openclaw"]["plugins"]["parallel"]["preferred"])')"
          INTEGRITY="$(npm view "@openclaw/parallel-plugin@${VERSION}" dist.integrity)"
          test -n "${INTEGRITY}"
          printf '%s\n' "${INTEGRITY}" > parallel-sri.txt
      - name: Upload integrity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parallel-sri
          path: parallel-sri.txt
          if-no-files-found: error
