name: Prepare v0.3.0 Release Metadata

on:
  push:
    branches:
      - release/v0.3.0
    paths:
      - .github/workflows/prepare-release-v030.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/v0.3.0
          fetch-depth: 0

      - name: Apply coherent version bump
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          root = Path('.')
          old = '0.2.0'
          new = '0.3.0'

          (root / 'VERSION').write_text(new + '\n', encoding='utf-8')

          pyproject = root / 'pyproject.toml'
          text = pyproject.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^version = "0\.2\.0"$', 'version = "0.3.0"', text, count=1)
          if count != 1:
              raise SystemExit('pyproject.toml: version attendue introuvable')
          pyproject.write_text(text, encoding='utf-8')

          init = root / 'src' / 'clawlocal' / '__init__.py'
          text = init.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^__version__ = "0\.2\.0"$', '__version__ = "0.3.0"', text, count=1)
          if count != 1:
              raise SystemExit('__init__.py: version attendue introuvable')
          init.write_text(text, encoding='utf-8')

          contracts = root / 'src' / 'clawlocal' / 'project_contracts.py'
          text = contracts.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^PLATFORM_VERSION = "0\.2\.0"$', 'PLATFORM_VERSION = "0.3.0"', text, count=1)
          if count != 1:
              raise SystemExit('project_contracts.py: PLATFORM_VERSION attendue introuvable')
          contracts.write_text(text, encoding='utf-8')

          for path in sorted((root / 'config' / 'v1').glob('*.yaml')):
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r'(?m)^(platform_version:\s*)["\']?0\.2\.0["\']?\s*$',
                  r'\g<1>"0.3.0"',
                  text,
                  count=1,
              )
              if count:
                  path.write_text(updated, encoding='utf-8')

          runtime = root / 'config' / 'v1' / 'runtime_versions.json'
          payload = json.loads(runtime.read_text(encoding='utf-8'))
          if payload.get('platform_version') != old:
              raise SystemExit('runtime_versions.json: platform_version inattendue')
          payload['platform_version'] = new
          runtime.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text, count = re.subn(r'version-0\.2\.0-blue', 'version-0.3.0-blue', text, count=1)
          if count != 1:
              raise SystemExit('README.md: badge version introuvable')
          readme.write_text(text, encoding='utf-8')

          status = root / 'STATUS.md'
          text = status.read_text(encoding='utf-8')
          text, count = re.subn(r'(## Version courante\s+\*\*)0\.2\.0', r'\g<1>0.3.0', text, count=1)
          if count != 1:
              raise SystemExit('STATUS.md: version courante introuvable')
          status.write_text(text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          if marker not in text:
              raise SystemExit('CHANGELOG.md: section Unreleased absente')
          if '## [0.3.0]' in text:
              raise SystemExit('CHANGELOG.md: section 0.3.0 déjà présente')
          text = text.replace(marker, marker + '\n## [0.3.0] - 2026-09-14\n', 1)
          added = '### Added\n\n'
          release_items = (
              '- chaîne de publication documentaire premium bornée Markdown/HTML/DOCX/PDF via Quarto/Pandoc/Typst, avec diagrammes Mermaid/Graphviz versionnés ;\n'
              '- outillage métier spécialisé et traçable par agent, sans élargissement des privilèges génériques, avec gate CI dédié ;\n'
              '- préparation de release gouvernée permettant une demande explicite du propriétaire avant création du tag et publication.\n'
          )
          pos = text.find(added, text.find('## [0.3.0]'))
          if pos == -1:
              raise SystemExit('CHANGELOG.md: section Added 0.3.0 introuvable')
          pos += len(added)
          text = text[:pos] + release_items + text[pos:]
          changelog.write_text(text, encoding='utf-8')

      - name: Validate release metadata
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python scripts/22_validate_configs.py
          python scripts/24_validate_release.py
          python scripts/44_validate_document_flow.py
          python scripts/47_validate_pre_v1_hardening.py
          python scripts/51_validate_specialist_tooling.py

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/prepare-release-v030.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare v0.3.0 release"
          git push origin HEAD:release/v0.3.0
