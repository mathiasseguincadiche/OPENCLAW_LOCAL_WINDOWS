name: Specialist Tooling

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: specialist-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: specialist-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Specialist tooling and publication contracts
        run: python scripts/51_validate_specialist_tooling.py
      - name: Unit tests
        run: pytest -q tests/test_specialist_tooling.py tests/test_publication.py
      - name: Ruff
        run: ruff check src/clawlocal/specialist_tools.py src/clawlocal/publication.py scripts/51_validate_specialist_tooling.py scripts/52_render_project_publication.py scripts/53_run_specialist_tool.py tests/test_specialist_tooling.py tests/test_publication.py
      - name: Mypy
        run: mypy src/clawlocal/specialist_tools.py src/clawlocal/publication.py
