name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Repository contracts
        run: python scripts/21_validate_repository.py
      - name: Configuration contracts
        run: python scripts/22_validate_configs.py
      - name: V7 parity-plus contracts
        run: python scripts/35_validate_v7_parity.py
      - name: V7 full parity superset
        run: python scripts/39_validate_v7_superset.py
      - name: Document ingestion and exchange gate
        run: python scripts/44_validate_document_flow.py
      - name: August 2026 model fleet gate
        run: python scripts/45_validate_model_fleet.py
      - name: Transversal pedagogy gate
        run: python scripts/46_validate_transversal_pedagogy.py
      - name: Pre-V1 hardening gate
        run: python scripts/47_validate_pre_v1_hardening.py
      - name: Documentation portal gate
        run: python scripts/48_validate_documentation_portal.py
      - name: OpenClaw 2026.9.4 lock gate
        run: python scripts/49_validate_openclaw_version.py
      - name: Release contracts
        run: python scripts/24_validate_release.py
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src
      - name: Tests with coverage
        run: pytest -q --cov=clawlocal --cov-report=term-missing --cov-fail-under=75

  openclaw-npm-smoke:
    name: openclaw-npm-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Set up Node 26.1.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.1.0"
      - name: Verify locked npm registry and tarball integrities
        run: python scripts/50_verify_npm_integrities.py --artifact-dir artifacts/npm-smoke
      - name: Install verified OpenClaw tarball and verify CLI
        shell: bash
        run: |
          set -euo pipefail
          CORE_VERSION="$(python -c 'import json; print(json.load(open("config/v1/runtime_versions.json"))["openclaw"]["preferred"])')"
          CORE_TARBALL="$(find artifacts/npm-smoke -maxdepth 1 -type f -name "openclaw-${CORE_VERSION}.tgz" -print -quit)"
          test -n "${CORE_TARBALL}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT
          npm install --global --prefix "${TMP}/global" "${CORE_TARBALL}"
          ACTUAL_VERSION="$("${TMP}/global/bin/openclaw" --version)"
          echo "OPENCLAW_NPM_SMOKE_VERSION=${ACTUAL_VERSION}"
          grep -F "${CORE_VERSION}" <<<"${ACTUAL_VERSION}" >/dev/null

  python-compatibility:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Runtime contracts
        run: |
          python scripts/21_validate_repository.py
          python scripts/22_validate_configs.py
          python scripts/35_validate_v7_parity.py
          python scripts/39_validate_v7_superset.py
          python scripts/44_validate_document_flow.py
          python scripts/45_validate_model_fleet.py
          python scripts/46_validate_transversal_pedagogy.py
          python scripts/47_validate_pre_v1_hardening.py
          python scripts/48_validate_documentation_portal.py
          python scripts/49_validate_openclaw_version.py
      - name: Tests
        run: pytest -q

  windows-contract:
    name: windows-contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python test dependencies
        shell: pwsh
        run: python -m pip install -e ".[dev]"
      - name: Windows filesystem hardening tests
        shell: pwsh
        run: python -m pytest -q .\tests\test_security_hardening.py .\tests\test_finops_reservations.py .\tests\test_pre_v1_hardening.py
      - name: Require PowerShell 7
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "PowerShell 7+ requis, version détectée: $($PSVersionTable.PSVersion)"
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
      - name: Install PowerShell quality modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            foreach ($parseError in @($parseErrors)) {
              $allErrors += [pscustomobject]@{ File = $_.FullName; ErrorId = $parseError.ErrorId; Message = $parseError.Message; Extent = $parseError.Extent.Text }
            }
          }
          if ($allErrors) {
            $allErrors | Format-Table -AutoSize -Wrap
            throw "Erreurs de parsing PowerShell: $($allErrors.Count)"
          }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $targets = @('.\menu.ps1', '.\scripts\windows', '.\tests\powershell')
          $findings = foreach ($target in $targets) {
            Invoke-ScriptAnalyzer -Path $target -Recurse -Settings '.\.github\powershell\PSScriptAnalyzerSettings.psd1'
          }
          if ($findings) {
            $findings | Format-Table -AutoSize
            throw "PSScriptAnalyzer a détecté $(@($findings).Count) anomalie(s)."
          }
      - name: Pester
        shell: pwsh
        run: Invoke-Pester -Path '.\tests\powershell' -CI -Output Detailed
      - name: Phase 3 dry-run contracts
        shell: pwsh
        run: |
          .\scripts\windows\08_configure_openclaw.ps1 -DryRun
          .\scripts\windows\09_deploy_agents.ps1 -DryRun
          .\scripts\windows\10_test_openclaw_e2e.ps1 -DryRun
      - name: Menu smoke test
        shell: pwsh
        run: .\menu.ps1 -Action docs
