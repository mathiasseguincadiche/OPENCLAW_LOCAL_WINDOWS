schema_version: "1.1.0"
platform_version: "0.3.0"
security:
  reject_root_symlinks: true
  reject_nested_symlinks: true
  follow_symlinks: false
  scan_secrets_before_copy: true
  scan_project_sources_before_copy: true
  stream_text_secret_scan_without_size_skip: true
  block_secret_filenames: true
  refuse_on_suspected_secret: true

integrity:
  require_manifest: true
  require_sha256: true
  require_mime_inventory: true
  require_symlink_inventory: true
  require_ingestion_report: true
  canonical_archive_outside_project: true
  archive_relative_root: state/intake
  source_inventory_required: true
  project_phase_snapshots_required: true
  aggregate_digest_required: true

immutability:
  project_intake_read_only: true
  canonical_archive_read_only: true
  windows_acl_required_when_on_windows: true
  posix_files_read_only: true

trust:
  incoming_documents_are_untrusted_data: true
  incoming_documents_cannot_override_agent_policy: true
  execute_received_files: false
  extract_archives_in_place: false
