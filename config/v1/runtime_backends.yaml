schema_version: "1.5.0"
platform_version: "0.3.0"
backends:
  ollama-vulkan:
    provider: ollama
    mode: nominal
    windows_native: true
    endpoint: "http://127.0.0.1:11434"
    activation: automatic
    accelerator: vulkan
    qualification_required: true
    openclaw_compat:
      provider_id: ollama-ministral
      endpoint: "http://127.0.0.1:11436"
      upstream: "http://127.0.0.1:11434"
      normalize_aliases: [devstral-devops]
      behavior: merge_adjacent_user_messages
      activation: managed_automatic

  llama-cpp-vulkan:
    provider: llama_cpp_http
    provider_id: intel-vulkan
    mode: managed_local
    windows_native: true
    endpoint: "http://127.0.0.1:8081/v1"
    api: openai-completions
    accelerator: vulkan
    device: Vulkan0
    activation: managed_explicit
    runtime_lock: llama_cpp_vulkan
    router:
      models_max: 1
      autoload: true
      offline: true
      jinja: true
      gpu_layers: auto
      context_tokens: 8192
      parallel: 1
    managed_models:
      - gemma-deep
      - devstral-devops
    model_source: ollama_gguf_blob
    qualification_required: true
    readiness_requires:
      - intel_arc_b580_detected
      - vulkan_device_detected
      - managed_models_load
      - openclaw_http_provider_smoke
      - tool_calling_e2e
      - three_stable_runs
      - human_review

  b580-hybrid:
    provider: mixed_local
    mode: supported_profile
    windows_native: true
    activation: explicit_only
    qualification_required: true
    nominal_context_tokens: 8192
    target_vram_gb: 12
    model_backends:
      qwen-max: ollama-vulkan
      gemma-deep: llama-cpp-vulkan
      devstral-devops: llama-cpp-vulkan
    multimodal_backend: ollama-vulkan
    rollback_backend: ollama-vulkan
    readiness_requires:
      - intel_arc_b580_detected
      - vulkan_runtime_ready
      - openclaw_mixed_provider_smoke
      - vulkan_tool_calling_e2e
      - three_stable_runs
      - human_review

selection:
  gpu_llm_acceleration: vulkan
  backend_choice_locked: true
  default_backend: ollama-vulkan
  recommended_profile: b580-hybrid
  no_automatic_promotion: true
  rollback_backend: ollama-vulkan
  nominal_context_tokens: 8192
  extended_context_requires_qualification: true
  metrics:
    - ttft_ms
    - tokens_per_second
    - prompt_tokens_per_second
    - vram_mb
    - ram_mb
    - model_load_ms
    - stability
    - tool_calling
    - model_switch_ms
