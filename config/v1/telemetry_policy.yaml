schema_version: "1.2.0"
platform_version: "0.3.0"
default_enabled: true
local_only: true
automatic_capture_for_orchestrator_calls: true
manual_recording_remains_optional: true

storage:
  relative_path: evidence/telemetry/runs.jsonl
  commit_to_git: false
  append_only: true

fields:
  required:
    - timestamp
    - project_id
    - agent
    - model
    - backend
    - route_kind
    - duration_ms
  optional:
    - phase
    - ttft_ms
    - tokens_per_second
    - prompt_tokens
    - generated_tokens
    - vram_mb
    - ram_mb
    - tool_calls
    - retries
    - local_to_deep_transition
    - success
    - error_class

compatibility:
  legacy_rows_may_be_read: true
  legacy_rows_must_never_enable_routing: true
  legacy_v0_2_read_only_fields:
    - cloud_escalation
    - cloud_cost_eur
  legacy_route_kinds_read_only:
    - cloud_escalation
  reject_legacy_fields_on_new_write: true

privacy:
  record_prompts: false
  record_responses: false
  record_secrets: false
  record_private_documents: false

quality:
  no_fabricated_measurements: true
  unknown_metrics_must_be_null_or_omitted: true
  monotonic_duration_required: true
  project_scoped: true
  extract_only_observed_runtime_metrics: true
