schema_version: "1.1.0"
platform_version: "0.3.0"
default_enabled: true
default_profile: balanced
default_mode: assisted
delivery_priority: true
learning_does_not_block_delivery_by_default: true
safety_overrides_pedagogy: true

transversal_enforcement:
  required: true
  applies_to_all_agents: true
  applies_to_all_supported_local_models: true
  cloud_llm_escalation_forbidden: true
  applies_to_all_orchestrator_phases: true
  shared_prompt_contract: agents/_shared/PEDAGOGY.md
  beginner_accessible_by_default: true
  preserve_expert_depth: true
  no_role_or_model_bypass: true

profiles:
  efficient:
    execution_share_percent: 90
    learning_share_percent: 10
    max_learning_objectives: 3
  balanced:
    execution_share_percent: 70
    learning_share_percent: 30
    max_learning_objectives: 3
  intensive:
    execution_share_percent: 60
    learning_share_percent: 40
    max_learning_objectives: 6

modes: [guided, assisted, autonomous, evaluation]
learning_verdicts: [ACQUIS, ACQUIS_AVEC_RESERVES, A_RENFORCER, NON_EVALUE]

help_ladder:
  - short_question
  - hint
  - targeted_correction
  - full_solution_with_justification
rules:
  ladder_steps_may_be_skipped: true
  direct_solution_allowed_on_request: true
  user_requested_conciseness_respected: true
  essential_prerequisites_risks_and_validation_never_omitted: true

competence_evidence:
  - explain_purpose
  - execute_or_review_meaningful_action
  - interpret_result
  - identify_risk
  - diagnose_representative_failure
  - reproduce_with_less_help

artifacts:
  root: context/learning
  learning_contract: context/learning/LEARNING_CONTRACT.json
  skills_matrix: context/learning/SKILLS_MATRIX.csv
  learning_journal: context/learning/LEARNING_JOURNAL.md
  teach_back: context/learning/TEACH_BACK.md
  retention_plan: context/learning/RETENTION_PLAN.yaml
  evaluations: context/learning/evaluations

principles:
  no_systematic_quiz: true
  no_daily_learning_report: true
  no_duplicate_documentation: true
  routine_tasks_execute_directly: true
  direct_solution_allowed_on_request: true
  incident_fix_first_debrief_after: true
  never_mark_acquired_from_exposure_only: true
  technical_verdict_is_distinct_from_learning_verdict: true
  explain_purpose_before_procedure_when_useful: true
  define_jargon_on_first_use: true
  explain_expected_result_and_validation: true
  explain_risk_limit_and_rollback_when_relevant: true
  no_false_simplification: true
  professional_non_infantilizing_tone: true

specialization:
  core:
    - linux_operations
    - git
    - bash_and_python_ops
    - terraform_or_opentofu
    - ansible
    - ci_cd
    - containers
  supporting:
    - networking
    - kubernetes_and_helm
    - security_fundamentals
    - observability
    - reliability_and_rollback
    - technical_documentation
