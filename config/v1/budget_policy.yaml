schema_version: "1.1.0"
platform_version: "0.3.0"
scope: historical_v0_2_cloud_llm_ledger_compatibility
llm_cloud_execution_supported: false
runtime_routing_enabled: false
currency: EUR
cloud_enabled_by_default: false
limits:
  daily_eur: 1.0
  monthly_eur: 5.0
  per_project_eur: 2.0
behavior:
  on_limit: deny
  require_reason: true
  default_reservation_eur: 0.25
  reservation_ttl_seconds: 3600
  require_cost_logging_when_available: true
  allow_manual_override: false
ledger:
  relative_path: state/finops/cloud-costs.jsonl
  commit_to_git: false
  append_only_events: true
  process_lock_required: true
