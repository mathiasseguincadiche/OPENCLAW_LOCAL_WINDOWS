schema_version: "2.1.0"
platform_version: "0.3.0"
suite: devops-v2
required_contexts: [8192, 16384]
optional_contexts: [32768]

runtime_budget:
  qualification_max_wall_seconds: 2400
  evaluation_reserve_seconds: 60
  benchmark_default_max_wall_seconds: 2100
  max_case_wall_seconds: 210

automated_gates:
  required_models: [qwen-max, gemma-deep, devstral-devops]
  scenario_matrix:
    qwen-max:
      "8192":
        - project-intake-analysis
        - gitlab-ci-valid
        - kubernetes-root-cause
        - security-pipeline-review
        - web-freshness-discipline
        - tool-intent-json
        - tool-feedback-repair-json
        - long-context-discipline
      "16384":
        - project-intake-analysis
        - long-context-discipline
    gemma-deep:
      "8192":
        - project-intake-analysis
        - terraform-multifile-change
        - ansible-idempotence
        - security-pipeline-review
        - rollback-runbook
        - architecture-diagram-d2
        - web-freshness-discipline
        - long-context-discipline
      "16384":
        - project-intake-analysis
        - long-context-discipline
    devstral-devops:
      "8192":
        - gitlab-ci-valid
        - kubernetes-root-cause
        - terraform-multifile-change
        - ansible-idempotence
        - security-pipeline-review
        - tool-intent-json
        - tool-feedback-repair-json
        - long-context-discipline
      "16384":
        - kubernetes-root-cause
        - long-context-discipline
  qwen_native_cases:
    - "8192:project-intake-analysis"
    - "8192:kubernetes-root-cause"
    - "16384:long-context-discipline"
  thresholds:
    max_error_rate: 0.0
    min_check_pass_rate: 0.875
    min_median_tokens_per_second: 6.0
    max_p95_first_token_ms: 12000
    per_context_min_check_pass_rate:
      "8192": 0.875
      "16384": 0.75

model_selection_challenger:
  required_before_manual_model_selection: true
  incumbent_alias: devstral-devops
  challenger_alias: granite-devops
  challenger_runtime_id: granite4.2:8b-q4_K_M
  context_tokens: 8192
  repetitions: 3
  protocol: native_tool_calling_v1
  required_capabilities:
    - native_tool_calling
    - tool_feedback_repair
    - coding
  comparison_metrics:
    - tool_intent_pass_rate
    - tool_repair_pass_rate
    - protocol_error_count
    - median_wall_ms
    - median_tokens_per_second
    - median_gpu_residency_ratio
  automatic_promotion: false
  human_decision_required: true
  evidence_required: true

promotion:
  automatic_promotion: false
  ready_verdict: READY_FOR_MANUAL_QUALIFICATION
  requires:
    - automated_gate_pass
    - openclaw_tool_call_smoke_pass
    - openclaw_tool_feedback_repair_pass
    - project_intake_e2e_pass
    - local_web_research_e2e_pass
    - multimodal_pdf_image_e2e_pass
    - stability_three_runs
    - human_review
    - local_only_nominal_path
    - vulkan_only_llm_path

supported_fleet:
  exact_aliases: [qwen-max, gemma-deep, devstral-devops]
  all_models_required: true
  allow_optional_local_models: false
  allow_unsupported_local_fallback: false
  benchmark_challengers_count_as_routed_models: false

runtime_backend_policy:
  gpu_llm_acceleration: vulkan
  backend_choice_locked: true
  allowed_backends: [ollama-vulkan, llama-cpp-vulkan, b580-hybrid]
  openclaw_selectable_profiles: [ollama-vulkan, b580-hybrid]
  backend_recomparison_required: false
  real_b580_runtime_evidence_required: true

safety:
  cloud_calls_allowed_during_qualification: false
  cloud_models_supported: false
  local_only: true
  persist_raw_outputs_in_git: false
  redact_secrets_before_manual_review: true
