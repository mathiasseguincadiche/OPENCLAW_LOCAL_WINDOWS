schema_version: "1.0.0"
platform_version: "0.3.0"
enabled: true
root: context/exchange
index_path: context/exchange/index.json

principles:
  central_project_is_source_of_truth: true
  agent_workspaces_are_disposable_snapshots: true
  never_overwrite_previous_runs: true
  publish_self_history_for_every_attempt: true
  publish_to_dependents_only_on_pass: true
  preserve_provenance: true
  hash_every_exchanged_file: true
  consumer_must_not_modify_exchange_in_place: true

propagation:
  direct_dependents: true
  transitive_dependents: true
  include_output_kinds: [work, deliverables, evidence, diagrams]
  resync_consumer_before_each_task: true
  include_previous_self_attempts: true

layout:
  consumer_root: context/exchange/{consumer_task_id}
  dependencies: context/exchange/{consumer_task_id}/dependencies/{producer_task_id}/run-{attempt}
  self_history: context/exchange/{producer_task_id}/self/run-{attempt}

validation:
  manifest_required: true
  aggregate_sha256_required: true
  producer_task_must_exist: true
  consumer_task_must_exist: true
  dependency_relation_must_be_provable: true
