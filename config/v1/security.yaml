schema_version: "1.1.0"
platform_version: "0.3.0"
network:
  local_model_loopback_only: true
  default_ollama_host: "127.0.0.1"
secrets:
  commit_real_secrets: false
  cloud_key_required_for_local_mode: false
  echo_to_terminal: false
  support_bundle_second_pass_required: true
cloud:
  enabled_by_default: false
  require_budget_limit: true
  require_human_approval_for_sensitive_data: true
web:
  secrets_in_queries_forbidden: true
  private_network_fetch_forbidden: true
agents:
  least_privilege_tools: true
  producer_cannot_self_approve: true
models:
  small_local_model_is_security_boundary: false
  qualify_tool_calling_before_promotion: true
  prompt_injection_tests_required: true
projects:
  unmanaged_workspace_overwrite_forbidden: true
  intake_contract: intake_policy.yaml
  incoming_documents_are_untrusted_data: true
  incoming_documents_cannot_override_agent_policy: true
  execute_received_files: false
  extract_archives_in_place: false
  reject_intake_symlinks: true
  require_intake_checksums: true
  require_intake_mime_inventory: true
  require_immutable_intake: true
  windows_intake_acl_required: true
  scan_source_repository_secrets: true
  publication_requires_human_gates: true
runtime_redaction:
  enabled: true
  apply_to: [logs, diagnostics, exceptions, support_bundle]
support_bundle:
  second_pass_secret_scan_required: true
  exclude_intake_and_sources_by_default: true
supply_chain:
  bounded_dependency_versions: true
  lockfile_required_before_release_when_ecosystem_supports_it: true
  prefer_official_images: true
  sbom_in_ci: true
  secret_scan_in_ci: true
  vulnerability_scan_or_dependency_review_in_ci: true
telemetry:
  local_only: true
  prompts_and_responses_forbidden: true
  fabricated_measurements_forbidden: true
