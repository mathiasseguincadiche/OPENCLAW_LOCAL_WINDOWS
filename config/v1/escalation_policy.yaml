schema_version: "2.0.0"
platform_version: "0.3.0"

llm_cloud:
  supported: false
  default: deny
  providers: []
  escalation_supported: false
  automatic_fallback: false
  supported_triggers: []
  reason: architecture_v2_local_only

remote_information_sources:
  web_tools_may_be_remote: true
  reasoning_model_must_be_local: true
  private_documents_must_not_be_sent_by_default: true
  secrets_must_not_be_sent: true

logging:
  record_denied_llm_cloud_request: true
  record_remote_tool_usage_when_available: true
